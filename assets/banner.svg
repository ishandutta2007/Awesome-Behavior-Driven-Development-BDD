<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#06d6a0" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .keyword-badge {
        font-family: 'SF Mono', Monaco, Menlo, 'Courier New', monospace;
        font-weight: 700;
        font-size: 14px;
      }
      .dynamic-pill-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .dynamic-pill-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .dynamic-pill-3 {
        animation: float3 8s ease-in-out infinite alternate;
      }
      .pulse-circle {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dash 12s linear infinite;
      }
      @keyframes float1 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-12px) translateX(8px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(14px) translateX(-6px); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-10px) translateX(-10px); }
      }
      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.96); transform-origin: center; }
        100% { opacity: 0.65; transform: scale(1.05); transform-origin: center; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="1060" cy="80" r="140" fill="#06d6a0" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="120" cy="300" r="160" fill="#7209b7" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="600" cy="40" r="100" fill="#00b4d8" opacity="0.1" filter="url(#glow)" />

  <!-- Animated Flow Line in Background -->
  <path d="M 50,300 C 300,320 400,240 700,260 S 950,220 1150,260" fill="none" stroke="#00b4d8" stroke-width="2" stroke-opacity="0.35" class="flow-line" />

  <!-- Dynamic Gherkin Interactive Cards (Right/Bottom Side - Safe Foreground Space) -->
  <!-- Pill 1: GIVEN -->
  <g class="dynamic-pill-1">
    <g transform="translate(860, 110)">
      <rect width="270" height="52" rx="10" fill="url(#card-grad)" stroke="#06d6a0" stroke-width="1.5" />
      <rect x="14" y="14" width="70" height="24" rx="6" fill="#06d6a0" fill-opacity="0.2" />
      <text x="49" y="31" fill="#06d6a0" text-anchor="middle" class="keyword-badge">GIVEN</text>
      <text x="96" y="31" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">user has feature specs</text>
    </g>
  </g>

  <!-- Pill 2: WHEN -->
  <g class="dynamic-pill-2">
    <g transform="translate(820, 180)">
      <rect width="310" height="52" rx="10" fill="url(#card-grad)" stroke="#00b4d8" stroke-width="1.5" />
      <rect x="14" y="14" width="65" height="24" rx="6" fill="#00b4d8" fill-opacity="0.2" />
      <text x="46" y="31" fill="#00b4d8" text-anchor="middle" class="keyword-badge">WHEN</text>
      <text x="92" y="31" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">tests execute in CI/CD</text>
    </g>
  </g>

  <!-- Pill 3: THEN -->
  <g class="dynamic-pill-3">
    <g transform="translate(860, 250)">
      <rect width="280" height="52" rx="10" fill="url(#card-grad)" stroke="#7209b7" stroke-width="1.5" />
      <rect x="14" y="14" width="65" height="24" rx="6" fill="#7209b7" fill-opacity="0.25" />
      <text x="46" y="31" fill="#b5179e" text-anchor="middle" class="keyword-badge">THEN</text>
      <text x="92" y="31" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">living docs are verified</text>
    </g>
  </g>

  <!-- Static High-Priority Foreground Header (Left & Center - Never obscured) -->
  <g transform="translate(70, 75)">
    <!-- Small Category Badge -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#00b4d8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#06d6a0" />
    <text x="32" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="1">CURATED BDD ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">Awesome Behavior-Driven</text>
    <text x="0" y="130" class="title-text">Development (BDD) 🚀</text>

    <!-- Subtitle / Catchphrase -->
    <text x="0" y="180" class="subtitle-text">Executable Specifications • Gherkin Standards • Living Documentation</text>
    <text x="0" y="210" class="subtitle-text" fill="#64748b" font-size="15">Empowering QA, Developers &amp; Business Stakeholders to bridge the specification gap</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="52" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">⚡ Cucumber</text>

      <rect x="115" y="0" width="100" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="165" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">🎯 Reqnroll</text>

      <rect x="225" y="0" width="95" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="272" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">🐍 Behave</text>

      <rect x="330" y="0" width="90" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="375" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">🥋 Karate</text>

      <rect x="430" y="0" width="90" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="475" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">📊 Gauge</text>
    </g>
  </g>
</svg>
